<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omröstning — resultat</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="assets/sambruk-logo.png" class="logo" alt="Sambruk"> Omröstning</div>
    <nav class="topnav">
      <a href=".">Rösta</a>
      <a href="results" class="active">Resultat</a>
      <a href="share">Dela</a>
      <a href="admin">Admin</a>
      <button onclick="toggleTheme()" title="Byt tema">◐</button>
    </nav>
  </div>

  <main class="wrap">
    <div class="hero">
      <h1 id="qTitle">Resultat</h1>
      <p id="qDesc" class="muted"></p>
      <div class="datechip" id="dateChip"></div>
    </div>

    <div id="picker" class="card hidden">
      <h2>Välj en omröstning</h2>
      <div id="pickerList"></div>
    </div>

    <div id="board">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div><strong id="totalVotes">0</strong> <span class="muted">röster totalt</span></div>
          <a class="btn sm ghost" href=".">← Rösta mer</a>
        </div>
      </div>
      <div class="card" id="ranking"><p class="muted center">Laddar…</p></div>
      <p class="center muted" style="font-size:.8rem">Poäng = uppskattad chans att slå ett slumpmässigt annat alternativ. Uppdateras automatiskt.</p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
